<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户画像快速分析平台</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="logo">👤</span>
      <h1>客户画像分析平台</h1>
    </div>
    <div class="nav-actions">
      <button id="btnImport" class="btn btn-primary">📥 导入数据</button>
      <button id="btnExport" class="btn btn-outline">📤 导出报告</button>
      <button id="btnSample" class="btn btn-ghost">🎲 示例数据</button>
    </div>
  </nav>

  <!-- 主容器 -->
  <main class="container">
    <!-- 数据输入区 -->
    <section id="dataInput" class="section card">
      <h2>📊 数据导入</h2>
      <div class="upload-area" id="dropZone">
        <div class="upload-icon">📁</div>
        <p>拖拽 CSV/JSON 文件到此处，或 <label for="fileInput" class="link">点击选择文件</label></p>
        <input type="file" id="fileInput" accept=".csv,.json" hidden>
        <small>支持 CSV、JSON 格式</small>
      </div>
      <div class="data-preview" id="dataPreview" style="display:none">
        <div class="preview-header">
          <span id="dataStats"></span>
          <button id="btnClear" class="btn btn-sm btn-ghost">🗑️ 清除</button>
        </div>
        <div class="table-wrapper">
          <table id="previewTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 分析控制台 -->
    <section id="analysisPanel" class="section card" style="display:none">
      <h2>🔬 分析控制台</h2>
      <div class="controls">
        <div class="control-group">
          <label>分析维度</label>
          <div class="checkbox-group" id="dimensions">
            <label><input type="checkbox" value="age" checked> 年龄分布</label>
            <label><input type="checkbox" value="gender" checked> 性别比例</label>
            <label><input type="checkbox" value="region" checked> 地域分布</label>
            <label><input type="checkbox" value="consumption" checked> 消费水平</label>
            <label><input type="checkbox" value="frequency" checked> 活跃频率</label>
            <label><input type="checkbox" value="preference" checked> 偏好标签</label>
          </div>
        </div>
        <div class="control-group">
          <label>聚类数量</label>
          <input type="range" id="clusterCount" min="2" max="8" value="4">
          <span id="clusterLabel">4 类</span>
        </div>
        <button id="btnAnalyze" class="btn btn-primary btn-lg">🚀 开始分析</button>
      </div>
    </section>

    <!-- 分析结果 -->
    <section id="results" class="section" style="display:none">
      <!-- 概览卡片 -->
      <div class="overview-cards" id="overviewCards"></div>

      <!-- 图表区域 -->
      <div class="charts-grid">
        <div class="card chart-card">
          <h3>👥 客户分群</h3>
          <canvas id="clusterChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>📊 年龄分布</h3>
          <canvas id="ageChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>🌍 地域分布</h3>
          <canvas id="regionChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>💰 消费水平</h3>
          <canvas id="consumptionChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>📈 活跃频率</h3>
          <canvas id="frequencyChart"></canvas>
        </div>
        <div class="card chart-card">
          <h3>🏷️ 偏好标签</h3>
          <canvas id="preferenceChart"></canvas>
        </div>
      </div>

      <!-- 客户画像卡 -->
      <h2 class="section-title">🎯 客户画像</h2>
      <div class="persona-cards" id="personaCards"></div>

      <!-- 详细数据表 -->
      <div class="card">
        <h3>📋 详细数据</h3>
        <div class="table-wrapper">
          <table id="resultTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="hiddenFileInput" accept=".csv,.json" hidden>

  <script src="js/analyzer.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
